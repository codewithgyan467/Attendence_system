name: Build & Release Android APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🟢 Setup Node.js (v22)
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: ☕ Setup Java Development Kit (JDK 21)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: 🤖 Setup Android SDK & Accept Licenses
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: 🐘 Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: 🧪 Run Backend Automated Security & Unit Tests
        run: |
          cd backend
          npm ci || npm install
          npm test -- -i

      - name: 📦 Install Frontend Dependencies & Build Web Assets
        run: |
          cd frontend
          npm ci || npm install
          npm run build
          npx cap sync android

      - name: 🔧 Prepare Gradle Executable
        run: |
          sed -i 's/\r$//' frontend/android/gradlew
          chmod +x frontend/android/gradlew

      - name: 🔑 Configure Release Signing Key (If Configured)
        id: sign_check
        run: |
          if [ -n "${{ secrets.HG_RELEASE_KEYSTORE_BASE64 }}" ]; then
            echo "Decoding release keystore..."
            echo "${{ secrets.HG_RELEASE_KEYSTORE_BASE64 }}" | base64 -d > frontend/android/app/hostelguard-release-key.jks
            echo "has_release_key=true" >> $GITHUB_OUTPUT
          else
            echo "No release keystore secret configured; falling back to assembleDebug."
            echo "has_release_key=false" >> $GITHUB_OUTPUT
          fi

      - name: 🔨 Compile Android APK with Gradle
        env:
          HG_KEYSTORE_PASSWORD: ${{ secrets.HG_KEYSTORE_PASSWORD }}
          HG_KEY_PASSWORD: ${{ secrets.HG_KEY_PASSWORD }}
          HG_KEY_ALIAS: ${{ secrets.HG_KEY_ALIAS }}
        run: |
          cd frontend/android
          if [ "${{ steps.sign_check.outputs.has_release_key }}" = "true" ]; then
            echo "Compiling signed production release APK..."
            ./gradlew assembleRelease --no-daemon --stacktrace
          else
            echo "Compiling development debug APK..."
            ./gradlew assembleDebug --no-daemon --stacktrace
          fi

      - name: 📋 Prepare APK & OTA Bundle Artifacts
        run: |
          mkdir -p release-output
          if [ -f "frontend/android/app/build/outputs/apk/release/app-release.apk" ]; then
            cp frontend/android/app/build/outputs/apk/release/app-release.apk release-output/app-release.apk
            cp frontend/android/app/build/outputs/apk/release/app-release.apk release-output/Attendra.apk
            cp frontend/android/app/build/outputs/apk/release/app-release.apk release-output/HostelGuard.apk
          elif [ -f "frontend/android/app/build/outputs/apk/debug/app-debug.apk" ]; then
            cp frontend/android/app/build/outputs/apk/debug/app-debug.apk release-output/app-debug.apk
            cp frontend/android/app/build/outputs/apk/debug/app-debug.apk release-output/Attendra.apk
            cp frontend/android/app/build/outputs/apk/debug/app-debug.apk release-output/HostelGuard.apk
          fi
          cd frontend/dist && zip -r ../../release-output/ota-bundle.zip . && cd ../..

      - name: 📤 Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Attendra-Android-and-OTA
          path: release-output/*
          retention-days: 30

      - name: 🚀 Publish GitHub Release with APK & OTA Bundle
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: "ATTENDRA Mobile App v1.0.${{ github.run_number }}"
          body: |
            ### 📱 ATTENDRA Enterprise Android APK & OTA Live Update (Build #${{ github.run_number }})
            
            Presence Powered by Intelligence. Automated production build for Android devices.
            
            #### 📦 Included Downloads:
            - **`Attendra.apk`**: Official signed APK for direct distribution.
            - **`app-release.apk`**: Direct installable release binary.
            - **`HostelGuard.apk`**: Backward-compatible binary link.
            - **`ota-bundle.zip`**: Over-The-Air live web bundle (No APK reinstall needed).
            
            #### ⚙️ Hardware Features:
            - Native Hardware GPS positioning with anti-spoof mock location detection
            - Native ESP32 BLE Hardware Beacon proximity verification
            - Native Front-Facing camera integration
            - Over-The-Air (OTA) live web updates powered by Capgo
            - Configurable backend server endpoint on login screen
          draft: false
          prerelease: false
          files: |
            release-output/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
