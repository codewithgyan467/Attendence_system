<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>HostelGuard AI | Smart Geofenced & Face Attendance System</title>
    <meta name="description" content="100% Free & Open-Source Hostel Attendance System with Geofencing, Mock Location Detection, and Facial Recognition" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#0f172a" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <!-- Instant Backend Preconnect & Server Wake-Up -->
    <link rel="preconnect" href="https://hostelguard-backend-oimp.onrender.com" crossorigin>
    <link rel="dns-prefetch" href="https://hostelguard-backend-oimp.onrender.com">
    <script>
      (function() {
        try {
          var backend = localStorage.getItem('hg_backend_url') || 'https://hostelguard-backend-oimp.onrender.com';
          if (backend && backend.indexOf('http') === 0) {
            var pingUrl = backend.replace(/\/api\/v1\/?$/, '') + '/health';
            fetch(pingUrl, { mode: 'cors', cache: 'no-store' }).catch(function() {});
          }
        } catch(e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
