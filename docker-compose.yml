version: '3.8'

services:
  # 1. Backend Service (Node.js API + SQLite + Python OpenCV AI)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: attendra_backend
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - AI_SERVICE_URL=http://localhost:8000
      - NODE_ENV=production
      - JWT_SECRET=${JWT_SECRET:-attendra_compose_jwt_secret_key_change_in_prod_2026}
      - ANCHOR_HMAC_SECRET=${ANCHOR_HMAC_SECRET:-HG_STRICT_ANCHOR_SECRET_2026}
      - FACE_SIMILARITY_THRESHOLD=0.38
      - AI_SERVICE_SECRET=${AI_SERVICE_SECRET:-hg-internal-mesh-secret-2026}
    volumes:
      - ./backend/data:/app/data
    restart: unless-stopped

  # 2. Frontend Web & Mobile Client (React Vite PWA)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: attendra_frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend
    restart: unless-stopped
